# Isolated migration prototype. No publication, no host sandbox relaxation.
# Based on tauri-v3.0.0-alpha.5/.github/workflows/test-cef-e2e.yml;
# its sysctl workaround is replaced by the packaged Chromium sandbox helper.
name: CEF prototype

on:
  push:
    branches: [codex/liberte-cef]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cef-prototype-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  prototype-scope:
    if: github.ref == 'refs/heads/codex/liberte-cef' || github.head_ref == 'codex/liberte-cef'
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Isolated CEF prototype; stable release workflow is excluded.'

  lockfile:
    name: Resolve and preserve Cargo.lock
    needs: prototype-scope
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the lockfile and preserve any required update for review
        run: python scripts/ci.py lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: error

  tooling:
    name: Release tooling regression tests
    needs: prototype-scope
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'ci_test.py' -v
      - run: python -m unittest discover -s scripts -p 'native_*test.py' -v
      - run: python scripts/ci.py versions

  rust-audit:
    name: RustSec dependency audit
    needs: lockfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cargo-lock
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the verified official cargo-audit release
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz \
            --output "$RUNNER_TEMP/cargo-audit.tgz"
          printf '%s  %s\n' ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39 "$RUNNER_TEMP/cargo-audit.tgz" | sha256sum --check -
          tar --extract --gzip --file "$RUNNER_TEMP/cargo-audit.tgz" --directory "$RUNNER_TEMP"
          "$RUNNER_TEMP/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit" --version
      - name: Audit the preserved lockfile against the current RustSec database
        continue-on-error: true
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ci-output" "$RUNNER_TEMP/audit-work/.cargo"
          cd "$RUNNER_TEMP/audit-work"
          printf '[advisories]\nignore = []\n' > .cargo/audit.toml
          set +e
          "$RUNNER_TEMP/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit" audit \
            --file "$GITHUB_WORKSPACE/Cargo.lock" \
            --url https://github.com/RustSec/advisory-db \
            --db "$RUNNER_TEMP/rustsec-advisory-db" --json \
            > "$GITHUB_WORKSPACE/.ci-output/cargo-audit.json"
          result=$?
          printf '%s\n' "$result" > "$GITHUB_WORKSPACE/.ci-output/cargo-audit-exit.txt"
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cargo-audit
          path: |
            .ci-output/cargo-audit.json
            .ci-output/cargo-audit-exit.txt
          if-no-files-found: warn
      - name: Print the complete RustSec report for review
        if: always() && hashFiles('.ci-output/cargo-audit.json') != ''
        run: cat .ci-output/cargo-audit.json
      - name: Require a complete audit with no known vulnerability
        if: always()
        run: python scripts/ci.py rust-audit-gate --report .ci-output/cargo-audit.json --status .ci-output/cargo-audit-exit.txt

  updater-lock:
    name: Resolve the shared updater test lock on Linux
    needs: prototype-scope
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - name: Validate the updater test lock or preserve a bootstrap candidate
        id: updater_lock
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          sys.path.insert(0, str(pathlib.Path('scripts').resolve()))
          import ci
          directory = pathlib.Path('vendor/tauri-plugin-updater').resolve()
          manifest, lock = directory / 'Cargo.toml', directory / 'Cargo.lock'
          metadata = ['cargo', 'metadata', '--manifest-path', str(manifest), '--locked', '--format-version', '1', '--color', 'never']
          valid = False
          if lock.is_file():
              result = subprocess.run(metadata, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, text=True, check=False)
              valid = result.returncode == 0
              if not valid:
                  print(result.stderr)
                  expected = f'cannot update the lock file {lock} because --locked was passed to prevent this'
                  if expected not in result.stderr:
                      raise subprocess.CalledProcessError(result.returncode, metadata, stderr=result.stderr)
          if not valid:
              print('::warning::Updater test lock is absent or incompatible. Generated candidate is diagnostic only until committed.')
              ci.run(['cargo', 'generate-lockfile', '--manifest-path', str(manifest)])
              ci.export_file(lock, 'vendor/tauri-plugin-updater/Cargo.lock')
          ci.run(metadata, stdout=subprocess.DEVNULL)
          if not lock.is_file() or not lock.stat().st_size:
              raise SystemExit('Updater test lock was not created')
          PY
      - name: Preserve the updater test lock and digest
        if: always() && hashFiles('vendor/tauri-plugin-updater/Cargo.lock') != ''
        run: |
          mkdir -p .ci-output/updater-tests
          sha256sum vendor/tauri-plugin-updater/Cargo.lock | tee .ci-output/updater-tests/Cargo.lock.sha256
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('vendor/tauri-plugin-updater/Cargo.lock') != ''
        with:
          name: updater-test-lock
          include-hidden-files: true
          path: |
            vendor/tauri-plugin-updater/Cargo.lock
            .ci-output/updater-tests/Cargo.lock.sha256
          if-no-files-found: error

  updater-tests:
    name: Vendored updater library tests (${{ matrix.label }})
    needs: updater-lock
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: linux-x86_64
          - runner: windows-latest
            label: windows-x86_64
          - runner: macos-14
            label: macos-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: updater-test-lock
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - name: Verify the shared Linux-generated updater lock digest
        shell: python
        run: |
          import hashlib, pathlib
          lock = pathlib.Path('vendor/tauri-plugin-updater/Cargo.lock')
          expected = pathlib.Path('.ci-output/updater-tests/Cargo.lock.sha256').read_text(encoding='utf-8').split()[0]
          actual = hashlib.sha256(lock.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit('Updater lock differs from the shared Linux artifact')
          print(f'Using the exact shared updater test lock: {actual}')
      - uses: Swatinem/rust-cache@v2
        with:
          key: cef-updater-tests-${{ matrix.label }}
          workspaces: vendor/tauri-plugin-updater -> target
          cache-on-failure: true
      - name: Preserve the active Linux updater dependency tree
        if: runner.os == 'Linux'
        run: |
          mkdir -p .ci-output/updater-tests
          cargo tree --manifest-path vendor/tauri-plugin-updater/Cargo.toml --locked --target x86_64-unknown-linux-gnu -e normal,build,features > .ci-output/updater-tests/linux-dependency-tree.txt
      - name: Test the upstream updater library with ZIP enabled on this OS
        id: updater_tests
        continue-on-error: true
        shell: python
        run: |
          import pathlib, subprocess, sys
          sys.stdout.reconfigure(encoding='utf-8')
          directory = pathlib.Path('.ci-output/updater-tests')
          directory.mkdir(parents=True, exist_ok=True)
          command = ['cargo', 'test', '--manifest-path', 'vendor/tauri-plugin-updater/Cargo.toml', '--lib', '--features', 'zip', '--locked']
          with (directory / 'tests.log').open('w', encoding='utf-8') as log:
              process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, encoding='utf-8', errors='replace')
              for line in process.stdout:
                  print(line, end='', flush=True)
                  log.write(line)
              result = process.wait()
          raise SystemExit(result)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updater-test-results-${{ matrix.label }}
          path: .ci-output/updater-tests
          if-no-files-found: warn
      - name: Require updater tests and the unchanged versioned shared lock
        if: always()
        shell: python
        env:
          LOCK: ${{ needs.updater-lock.result }}
          TESTS: ${{ steps.updater_tests.outcome }}
        run: |
          import os, subprocess
          if os.environ.get('LOCK') != 'success' or os.environ.get('TESTS') != 'success':
              raise SystemExit('Updater lock resolution and platform tests must both succeed')
          subprocess.run(['git', 'ls-files', '--error-unmatch', 'vendor/tauri-plugin-updater/Cargo.lock'], check=True)
          subprocess.run(['git', 'diff', '--exit-code', '--', 'vendor/tauri-plugin-updater/Cargo.lock'], check=True)

  frontend:
    name: Frontend tests, types and build
    needs: prototype-scope
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Bootstrap a changed frontend manifest explicitly
        run: python3 scripts/ci.py frontend-lock
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-lock
          path: frontend/package-lock.json
          if-no-files-found: error
      - run: npm ci
        working-directory: frontend
      - name: Preserve dependency audit diagnostics
        id: audit
        continue-on-error: true
        working-directory: frontend
        run: |
          mkdir -p ../.ci-output
          npm audit --json > ../.ci-output/npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit
          path: .ci-output/npm-audit.json
          if-no-files-found: warn
      - name: Print dependency audit for review
        if: always() && hashFiles('.ci-output/npm-audit.json') != ''
        run: cat .ci-output/npm-audit.json
      - id: tests
        continue-on-error: true
        run: npm test
        working-directory: frontend
      - id: types
        continue-on-error: true
        run: npm run typecheck
        working-directory: frontend
      - id: build
        continue-on-error: true
        run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
      - name: Reject high and critical dependency vulnerabilities
        id: audit_gate
        if: always()
        continue-on-error: true
        run: python3 scripts/ci.py audit-gate .ci-output/npm-audit.json
      - name: Require frontend tests, types and build to pass
        if: always()
        env:
          TESTS: ${{ steps.tests.outcome }}
          TYPES: ${{ steps.types.outcome }}
          BUILD: ${{ steps.build.outcome }}
          AUDIT: ${{ steps.audit_gate.outcome }}
        run: |
          for result in "$TESTS" "$TYPES" "$BUILD" "$AUDIT"; do
            test "$result" = success || exit 1
          done

  media:
    name: Browser media integration
    needs: frontend
    if: always() && needs.frontend.outputs.build == 'success'
    runs-on: ubuntu-24.04
    env:
      LIBERTE_SFU_TEST_URL: ws://127.0.0.1:7880
      LIBERTE_SFU_API_KEY: liberte-ci
      LIBERTE_SFU_API_SECRET: liberte-ci-only-not-a-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-lock
          path: frontend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start a local LiveKit instance for browser integration
        run: |
          docker run --detach --name liberte-ci-livekit --network host \
            --env "LIVEKIT_KEYS=$LIBERTE_SFU_API_KEY: $LIBERTE_SFU_API_SECRET" \
            livekit/livekit-server:v1.13.10 \
            --dev --bind 127.0.0.1 --node-ip 127.0.0.1
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:7880/; then exit 0; fi
            sleep 1
          done
          docker logs liberte-ci-livekit
          exit 1
      - run: npm run test:media
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-media-failure
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: warn
      - name: Preserve LiveKit diagnostics and stop the test server
        if: always()
        run: |
          docker logs liberte-ci-livekit || true
          docker rm --force liberte-ci-livekit || true

  docker:
    name: Docker build, export, load and API smoke
    needs: lockfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cargo-lock
      - uses: docker/setup-buildx-action@v3
      - name: Build a loadable image
        run: docker buildx build --platform linux/amd64 --load --tag liberte-ci:${{ github.sha }} --file docker/Dockerfile .
      - name: Export and reload the actual image
        shell: bash
        run: |
          set -euo pipefail
          docker save --output liberte-ci.tar liberte-ci:${{ github.sha }}
          test -s liberte-ci.tar
          docker image rm liberte-ci:${{ github.sha }}
          docker load --input liberte-ci.tar
          docker image inspect liberte-ci:${{ github.sha }} > /dev/null
      - name: Check health and authentication after reload
        run: python3 scripts/ci.py smoke --image liberte-ci:${{ github.sha }}

  linux:
    name: CEF Linux build, server and real native QA
    needs: [lockfile, frontend, updater-tests]
    if: always() && needs.lockfile.result == 'success' && needs.frontend.outputs.build == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      native-livekit:
        image: livekit/livekit-server:v1.13.10
        env:
          LIVEKIT_CONFIG: |
            port: 7880
            bind_addresses: [0.0.0.0]
            rtc:
              node_ip: 127.0.0.1
              udp_port: 7882
              tcp_port: 7881
              use_external_ip: false
              enable_loopback_candidate: true
              stun_servers: []
            keys:
              liberte-native-ci: liberte-native-ci-only-not-a-production-secret
        ports:
          - '127.0.0.1:7880:7880/tcp'
          - '127.0.0.1:7881:7881/tcp'
          - '127.0.0.1:7882:7882/udp'
    env:
      LIBERTE_SFU_TEST_URL: ws://127.0.0.1:7880
      LIBERTE_SFU_API_KEY: liberte-native-ci
      LIBERTE_SFU_API_SECRET: liberte-native-ci-only-not-a-production-secret
    steps:
      - name: Configure the CEF distribution directory
        run: printf 'CEF_PATH=%s/tauri-cef\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cargo-lock
      - uses: actions/download-artifact@v4
        with:
          name: frontend-lock
          path: frontend
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: cef-prototype-linux
          cache-on-failure: true
      - name: Resolve the pinned CEF distribution version
        id: cef_version
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          packages = tomllib.loads(pathlib.Path('Cargo.lock').read_text())['package']
          versions = [item['version'] for item in packages if item['name'] == 'cef']
          if versions != ['154.5.0+154.0.34']:
              raise SystemExit(f'Unexpected CEF version: {versions}; review the runtime/cache pin')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={versions[0]}\n')
          PY
      - uses: actions/cache@v4
        with:
          path: ${{ env.CEF_PATH }}
          key: cef-prototype-linux-${{ steps.cef_version.outputs.version }}
      - name: Install GTK4, Chromium runtime and headless desktop dependencies
        run: |
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 install -y libgtk-3-dev libgtk-4-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev libnss3-dev libxss1 libxkbcommon-dev libgbm-dev libdrm-dev libxtst-dev libxrandr-dev libx11-dev libxcomposite-dev libxcursor-dev libxi-dev libxdamage-dev libxext-dev pkg-config patchelf binutils perl xvfb xauth x11-utils fluxbox dbus-x11 pulseaudio pulseaudio-utils
          pkg-config --atleast-version=4.14 gtk4
          mkdir -p .ci-output/cef-runtime
          pkg-config --modversion gtk4 > .ci-output/cef-runtime/gtk4-version.txt
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns > .ci-output/cef-runtime/apparmor-userns.txt
          fi
      - run: npm ci
        working-directory: frontend
      - name: Test the CDP transport and capture observation helpers
        id: cdp_helpers
        continue-on-error: true
        run: node --test scripts/cdp_driver_test.mjs scripts/cdp_media_probe.test.mjs
      - name: Check formatting and preserve the exact correction patch
        id: format
        continue-on-error: true
        run: python scripts/ci.py format-patch
      - uses: actions/upload-artifact@v4
        if: steps.format.outcome == 'failure'
        with:
          name: cef-rustfmt-patch
          path: .ci-output/rustfmt.patch
          if-no-files-found: warn
      - name: Compile the migrated workspace
        id: check
        continue-on-error: true
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          cargo check --workspace --all-targets --locked
      - name: Test the migrated workspace
        id: tests
        continue-on-error: true
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/debug:${LD_LIBRARY_PATH:-}"
          cargo test --workspace --locked
      - name: Check migrated Rust code with Clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build the real server
        id: server_build
        continue-on-error: true
        run: cargo build --release --locked --bin liberte-server
      - name: Exercise server authentication and persistence API
        id: server_smoke
        if: steps.server_build.outcome == 'success'
        continue-on-error: true
        run: python scripts/ci.py smoke --binary target/release/liberte-server
      - name: Disable release updating in this unsigned prototype
        run: python scripts/ci.py prepare-updater
      - name: Build the production CEF Debian package
        id: production
        continue-on-error: true
        working-directory: crates/liberte-client
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          node ../../frontend/node_modules/@tauri-apps/cli/tauri.js build --bundles deb --config tauri-ci.conf.json -- --locked
      - name: Install the packaged Chromium sandbox without changing host policy
        id: sandbox
        if: steps.production.outcome == 'success'
        run: |
          mapfile -t packages < <(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb')
          test "${#packages[@]}" -eq 1
          package="${packages[0]}"
          package_name=$(dpkg-deb --field "$package" Package)
          sudo dpkg --install "$package"
          mapfile -t helpers < <(dpkg-query --listfiles "$package_name" | sed -n '\|/chrome-sandbox$|p')
          test "${#helpers[@]}" -eq 1
          helper="${helpers[0]}"
          test -f "$helper"
          test "$(stat -c '%u:%g:%a' "$helper")" = '0:0:4755'
          printf 'CHROME_DEVEL_SANDBOX=%s\n' "$helper" >> "$GITHUB_ENV"
          stat -c '%n owner=%u group=%g mode=%a' "$helper" > .ci-output/cef-runtime/sandbox.txt
          sha256sum "$helper" >> .ci-output/cef-runtime/sandbox.txt
          sha256sum "$package" > .ci-output/cef-runtime/production-package.sha256
      - name: Build the separate CEF QA binary with CDP and synthetic capture
        id: qa_build
        continue-on-error: true
        working-directory: crates/liberte-client
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          node ../../frontend/node_modules/@tauri-apps/cli/tauri.js build --debug --no-bundle --features qa-media-devices,tauri/custom-protocol --config tauri-ci.conf.json -- --locked
      - name: Verify the QA runtime uses the packaged sandbox helper
        id: qa_sandbox
        if: steps.qa_build.outcome == 'success' && steps.sandbox.outcome == 'success'
        run: |
          test -n "$CHROME_DEVEL_SANDBOX"
          test "$(stat -c '%u:%g:%a' "$CHROME_DEVEL_SANDBOX")" = '0:0:4755'
          test -f target/debug/chrome-sandbox
          cmp target/debug/chrome-sandbox "$CHROME_DEVEL_SANDBOX"
          sha256sum target/debug/liberte-client > .ci-output/cef-runtime/qa-client.sha256
          sha256sum target/debug/libcef.so > .ci-output/cef-runtime/qa-runtime.sha256
      - name: Configure an isolated audio output for the native media test
        id: pulse
        if: steps.qa_build.outcome == 'success' && steps.qa_sandbox.outcome == 'success'
        run: |
          if ! pulseaudio --check; then
            pulseaudio --daemonize=yes --exit-idle-time=-1
            touch .ci-output/cef-runtime/pulse-started
          fi
          pactl load-module module-null-sink sink_name=liberte_ci > .ci-output/cef-runtime/pulse-module.txt
          pactl set-default-sink liberte_ci
          socket=$(LANG=C pactl info | sed -n 's/^Server String: //p')
          case "$socket" in
            unix:*) ;;
            /*) socket="unix:$socket" ;;
            *) echo 'PulseAudio did not expose a local Unix socket'; exit 1 ;;
          esac
          cookie="${XDG_CONFIG_HOME:-$HOME/.config}/pulse/cookie"
          test -f "$cookie"
          printf 'PULSE_SERVER=%s\nPULSE_COOKIE=%s\n' "$socket" "$cookie" >> "$GITHUB_ENV"
      - name: Exercise native identity, channel and persistence through CEF
        id: native_smoke
        if: steps.qa_build.outcome == 'success' && steps.qa_sandbox.outcome == 'success'
        continue-on-error: true
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/debug:${LD_LIBRARY_PATH:-}"
          dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" bash -euc '
            fluxbox > .ci-output/cef-runtime/fluxbox-smoke.log 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            for attempt in $(seq 1 30); do
              if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"; then break; fi
              sleep 0.1
            done
            xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"
            python scripts/native_smoke.py --driver cef --application target/debug/liberte-client
          '
      - name: Exercise two real CEF clients, file transfer and server backup
        id: native_integration
        if: steps.qa_build.outcome == 'success' && steps.qa_sandbox.outcome == 'success' && steps.server_build.outcome == 'success'
        continue-on-error: true
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/debug:${LD_LIBRARY_PATH:-}"
          dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" bash -euc '
            fluxbox > .ci-output/cef-runtime/fluxbox-integration.log 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            for attempt in $(seq 1 30); do
              if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"; then break; fi
              sleep 0.1
            done
            xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"
            python scripts/native_integration.py --driver cef --application target/debug/liberte-client --server target/release/liberte-server
          '
      - name: Measure bidirectional native CEF media with synthetic capture
        id: native_media
        if: steps.qa_build.outcome == 'success' && steps.qa_sandbox.outcome == 'success' && steps.pulse.outcome == 'success'
        continue-on-error: true
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/debug:${LD_LIBRARY_PATH:-}"
          dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" bash -euc '
            fluxbox > .ci-output/cef-runtime/fluxbox-media.log 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            for attempt in $(seq 1 30); do
              if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"; then break; fi
              sleep 0.1
            done
            xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"
            python scripts/native_media.py --driver cef --application target/debug/liberte-client
          '
      - name: Check the declarative native SFU service
        id: native_sfu_server
        if: steps.qa_build.outcome == 'success' && steps.qa_sandbox.outcome == 'success' && steps.server_build.outcome == 'success'
        continue-on-error: true
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:7880/; then exit 0; fi
            sleep 1
          done
          echo 'The GitHub-managed LiveKit service did not respond on loopback.'
          exit 1
      - name: Verify native SFU encryption and rejection of an incompatible CEF peer key
        id: native_sfu
        if: steps.qa_build.outcome == 'success' && steps.qa_sandbox.outcome == 'success' && steps.pulse.outcome == 'success' && steps.native_sfu_server.outcome == 'success'
        continue-on-error: true
        env:
          LIVEKIT_URL: ${{ env.LIBERTE_SFU_TEST_URL }}
          LIVEKIT_API_KEY: ${{ env.LIBERTE_SFU_API_KEY }}
          LIVEKIT_API_SECRET: ${{ env.LIBERTE_SFU_API_SECRET }}
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/debug:${LD_LIBRARY_PATH:-}"
          dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" bash -euc '
            fluxbox > .ci-output/cef-runtime/fluxbox-sfu.log 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            for attempt in $(seq 1 30); do
              if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"; then break; fi
              sleep 0.1
            done
            xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"
            python scripts/native_sfu.py --driver cef --application target/debug/liberte-client --server target/release/liberte-server --artifacts .ci-output/native-sfu
          '
      - name: Stop the test audio output
        if: always()
        run: |
          if test -f .ci-output/cef-runtime/pulse-module.txt; then
            pactl unload-module "$(cat .ci-output/cef-runtime/pulse-module.txt)" || true
          fi
          if test -f .ci-output/cef-runtime/pulse-started; then pulseaudio --kill || true; fi
      - name: Record final disk use
        if: always()
        run: df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - name: Preserve native reports, screenshots and runtime diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cef-native-diagnostics-${{ github.sha }}
          path: |
            .ci-output/native-smoke
            .ci-output/native-integration
            .ci-output/native-media
            .ci-output/native-sfu
            .ci-output/cef-runtime
          if-no-files-found: warn
      - name: Require every compilation, server and native verification
        if: always()
        env:
          UPDATER_TESTS: ${{ needs.updater-tests.result }}
          FORMAT: ${{ steps.format.outcome }}
          CHECK: ${{ steps.check.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          CDP_HELPERS: ${{ steps.cdp_helpers.outcome }}
          SERVER_BUILD: ${{ steps.server_build.outcome }}
          SERVER_SMOKE: ${{ steps.server_smoke.outcome }}
          PRODUCTION: ${{ steps.production.outcome }}
          SANDBOX: ${{ steps.sandbox.outcome }}
          QA_BUILD: ${{ steps.qa_build.outcome }}
          QA_SANDBOX: ${{ steps.qa_sandbox.outcome }}
          NATIVE_SMOKE: ${{ steps.native_smoke.outcome }}
          NATIVE_INTEGRATION: ${{ steps.native_integration.outcome }}
          NATIVE_MEDIA: ${{ steps.native_media.outcome }}
          SFU_SERVER: ${{ steps.native_sfu_server.outcome }}
          NATIVE_SFU: ${{ steps.native_sfu.outcome }}
        run: |
          python - <<'PY'
          import os
          names = ('UPDATER_TESTS', 'FORMAT', 'CHECK', 'TESTS', 'CLIPPY', 'CDP_HELPERS', 'SERVER_BUILD', 'SERVER_SMOKE', 'PRODUCTION', 'SANDBOX', 'QA_BUILD', 'QA_SANDBOX', 'NATIVE_SMOKE', 'NATIVE_INTEGRATION', 'NATIVE_MEDIA', 'SFU_SERVER', 'NATIVE_SFU')
          failures = {name: os.environ.get(name, 'missing') for name in names if os.environ.get(name) != 'success'}
          if failures:
              raise SystemExit(f'CEF prototype verification failed: {failures}')
          PY
      - name: Collect the unsigned prototype and exact build provenance
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess, tomllib
          root = pathlib.Path.cwd()
          destination = root / '.ci-output/cef-package'
          destination.mkdir(parents=True, exist_ok=True)
          packages = list((root / 'target/release/bundle/deb').glob('*.deb'))
          if len(packages) != 1:
              raise SystemExit('Expected exactly one production Debian package')
          for source in [packages[0], root / 'target/release/liberte-server']:
              shutil.copy2(source, destination / source.name)
          def sha256(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()
          hashes = {path.name: sha256(path) for path in destination.iterdir() if path.is_file()}
          (destination / 'SHA256SUMS').write_text(''.join(f'{digest}  {name}\n' for name, digest in sorted(hashes.items())))
          lock = tomllib.loads((root / 'Cargo.lock').read_text())['package']
          versions = {item['name']: item['version'] for item in lock if item['name'] in ('cef', 'cef-dll-sys', 'tauri', 'tauri-runtime-cef')}
          provenance = {'commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'runner': 'ubuntu-24.04', 'rust': subprocess.check_output(['rustc', '--version'], text=True).strip(), 'runtime_versions': versions, 'files': hashes, 'production_client_sha256': sha256(root / 'target/release/liberte-client'), 'qa_client_sha256': sha256(root / 'target/debug/liberte-client'), 'qa_feature': 'qa-media-devices', 'qa_in_artifact': False, 'status': 'experimental unsigned CEF migration prototype; no release publication', 'media_scope': 'mesh and encrypted SFU with synthetic capture, independent wrong-key CEF publisher and automated permission selection; no physical microphone/camera or manual permission-dialog validation'}
          (destination / 'provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          print(json.dumps(provenance, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cef-prototype-linux-${{ github.sha }}
          path: .ci-output/cef-package
          if-no-files-found: error

  wry-desktop:
    name: Tauri 3 Wry package and server smoke (${{ matrix.label }})
    needs: [lockfile, frontend, updater-tests, rust-audit]
    if: always() && needs.lockfile.result == 'success' && needs.frontend.outputs.build == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: windows-x86_64
            bundle: nsis
            server: target/release/liberte-server.exe
          - runner: macos-14
            label: macos-aarch64
            bundle: app
            server: target/release/liberte-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cargo-lock
      - uses: actions/download-artifact@v4
        with:
          name: frontend-lock
          path: frontend
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
        with:
          key: cef-prototype-wry-${{ matrix.label }}
          cache-on-failure: true
      - run: npm ci
        working-directory: frontend
      - name: Disable release updating in unsigned prototype packages
        run: python scripts/ci.py prepare-updater
      - name: Build the Wry desktop package without Linux QA features
        id: desktop_build
        continue-on-error: true
        working-directory: crates/liberte-client
        run: node ../../frontend/node_modules/@tauri-apps/cli/tauri.js build --bundles ${{ matrix.bundle }} --config tauri-ci.conf.json -- --locked
      - name: Build the platform server
        id: server_build
        continue-on-error: true
        run: cargo build --release --locked --bin liberte-server
      - name: Exercise the real platform server health and authentication API
        id: server_smoke
        if: steps.server_build.outcome == 'success'
        continue-on-error: true
        run: python scripts/ci.py smoke --binary ${{ matrix.server }}
      - name: Require platform builds, server smoke and dependency verification
        if: always()
        shell: python
        env:
          FRONTEND: ${{ needs.frontend.result }}
          UPDATER: ${{ needs.updater-tests.result }}
          RUST_AUDIT: ${{ needs.rust-audit.result }}
          DESKTOP: ${{ steps.desktop_build.outcome }}
          SERVER_BUILD: ${{ steps.server_build.outcome }}
          SERVER_SMOKE: ${{ steps.server_smoke.outcome }}
        run: |
          import os
          names = ('FRONTEND', 'UPDATER', 'RUST_AUDIT', 'DESKTOP', 'SERVER_BUILD', 'SERVER_SMOKE')
          failures = {name: os.environ.get(name, 'missing') for name in names if os.environ.get(name) != 'success'}
          if failures:
              raise SystemExit(f'Wry prototype verification failed: {failures}')
      - name: Collect the package, server and explicit verification scope
        shell: python
        env:
          PACKAGE_LABEL: ${{ matrix.label }}
          SERVER_PATH: ${{ matrix.server }}
        run: |
          import hashlib, json, os, pathlib, shutil, subprocess, sys, tomllib
          subprocess.run([sys.executable, 'scripts/ci.py', 'package-desktop', '--label', os.environ['PACKAGE_LABEL']], check=True)
          destination = pathlib.Path('.ci-output/desktop')
          server = pathlib.Path(os.environ['SERVER_PATH'])
          copied = destination / server.name
          shutil.copy2(server, copied)
          with copied.open('rb') as stream:
              server_hash = hashlib.file_digest(stream, 'sha256').hexdigest()
          with (destination / 'SHA256SUMS').open('a', encoding='utf-8') as output:
              output.write(f'{server_hash}  {copied.name}\n')
          metadata_path = destination / 'build.json'
          metadata = json.loads(metadata_path.read_text(encoding='utf-8'))
          lock = tomllib.loads(pathlib.Path('Cargo.lock').read_text(encoding='utf-8'))['package']
          metadata.update(status='experimental unsigned Tauri 3 Wry migration prototype', run_id=os.environ['GITHUB_RUN_ID'], runtime_packages=[{'name': item['name'], 'version': item['version']} for item in lock if item['name'] in ('tauri', 'tauri-runtime-wry', 'wry')], server={'file': copied.name, 'sha256': server_hash}, verification={'desktop': 'compiled and packaged; native UI and media not exercised on this OS', 'server': 'real loopback health, version, admin credential and unauthenticated API rejection smoke', 'qa_media_devices': False})
          metadata_path.write_text(json.dumps(metadata, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(metadata, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: wry-prototype-${{ matrix.label }}-${{ github.sha }}
          path: .ci-output/desktop
          if-no-files-found: error
          retention-days: 14

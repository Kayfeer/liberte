name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      require-committed-lock:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  lockfile:
    name: Resolve and preserve Cargo.lock
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the lockfile and preserve any required update for review
        run: python scripts/ci.py lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: error
      - name: Require a versioned lockfile for release
        if: inputs.require-committed-lock
        run: |
          git ls-files --error-unmatch Cargo.lock
          git diff --exit-code -- Cargo.lock

  tooling:
    name: Release tooling regression tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'ci_test.py' -v
      - run: python -m unittest discover -s scripts -p 'native_*test.py' -v
      - run: python scripts/ci.py versions

  rust-audit:
    name: RustSec dependency audit
    needs: lockfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cargo-lock
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the verified official cargo-audit release
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz \
            --output "$RUNNER_TEMP/cargo-audit.tgz"
          printf '%s  %s\n' ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39 "$RUNNER_TEMP/cargo-audit.tgz" | sha256sum --check -
          tar --extract --gzip --file "$RUNNER_TEMP/cargo-audit.tgz" --directory "$RUNNER_TEMP"
          "$RUNNER_TEMP/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit" --version
      - name: Audit the preserved lockfile against the current RustSec database
        continue-on-error: true
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ci-output" "$RUNNER_TEMP/audit-work/.cargo"
          cd "$RUNNER_TEMP/audit-work"
          printf '[advisories]\nignore = []\n' > .cargo/audit.toml
          set +e
          "$RUNNER_TEMP/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit" audit \
            --file "$GITHUB_WORKSPACE/Cargo.lock" \
            --url https://github.com/RustSec/advisory-db \
            --db "$RUNNER_TEMP/rustsec-advisory-db" --json \
            > "$GITHUB_WORKSPACE/.ci-output/cargo-audit.json"
          result=$?
          printf '%s\n' "$result" > "$GITHUB_WORKSPACE/.ci-output/cargo-audit-exit.txt"
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cargo-audit
          path: |
            .ci-output/cargo-audit.json
            .ci-output/cargo-audit-exit.txt
          if-no-files-found: warn
      - name: Print the complete RustSec report for review
        if: always() && hashFiles('.ci-output/cargo-audit.json') != ''
        run: cat .ci-output/cargo-audit.json
      - name: Require a complete audit with no known vulnerability
        if: always()
        run: python scripts/ci.py rust-audit-gate --report .ci-output/cargo-audit.json --status .ci-output/cargo-audit-exit.txt

  frontend:
    name: Frontend tests, types and build
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Bootstrap a changed frontend manifest explicitly
        run: python3 scripts/ci.py frontend-lock
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-lock
          path: frontend/package-lock.json
          if-no-files-found: error
      - name: Require the exact committed frontend lockfile for release
        if: inputs.require-committed-lock
        run: git diff --exit-code -- frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Preserve dependency audit diagnostics
        id: audit
        continue-on-error: true
        working-directory: frontend
        run: |
          mkdir -p ../.ci-output
          npm audit --json > ../.ci-output/npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit
          path: .ci-output/npm-audit.json
          if-no-files-found: warn
      - name: Print dependency audit for review
        if: always() && hashFiles('.ci-output/npm-audit.json') != ''
        run: cat .ci-output/npm-audit.json
      - id: tests
        continue-on-error: true
        run: npm test
        working-directory: frontend
      - id: types
        continue-on-error: true
        run: npm run typecheck
        working-directory: frontend
      - id: build
        continue-on-error: true
        run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
      - name: Reject high and critical dependency vulnerabilities
        id: audit_gate
        if: always()
        continue-on-error: true
        run: python3 scripts/ci.py audit-gate .ci-output/npm-audit.json
      - name: Require frontend tests, types and build to pass
        if: always()
        env:
          TESTS: ${{ steps.tests.outcome }}
          TYPES: ${{ steps.types.outcome }}
          BUILD: ${{ steps.build.outcome }}
          AUDIT: ${{ steps.audit_gate.outcome }}
        run: |
          for result in "$TESTS" "$TYPES" "$BUILD" "$AUDIT"; do
            test "$result" = success || exit 1
          done

  desktop:
    name: Desktop package (${{ matrix.label }})
    needs: [lockfile, frontend]
    if: always() && needs.lockfile.result == 'success' && needs.frontend.outputs.build == 'success'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: windows-x86_64
            bundle: nsis
          - runner: ubuntu-22.04
            label: linux-x86_64
            bundle: appimage
          - runner: macos-14
            label: macos-aarch64
            bundle: app
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cargo-lock
      - uses: actions/download-artifact@v4
        with:
          name: frontend-lock
          path: frontend
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.label }}
          cache-on-failure: true
      - name: Install Linux build and media dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev pkg-config perl gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav libnice10 webkit2gtk-driver xvfb xauth dbus-x11
      - run: npm ci
        working-directory: frontend
      - name: Disable release updating for unsigned CI packages
        run: python scripts/ci.py prepare-updater
      - name: Build a testable desktop package
        working-directory: crates/liberte-client
        run: node ../../frontend/node_modules/@tauri-apps/cli/tauri.js build --bundles ${{ matrix.bundle }} --config tauri-ci.conf.json -- --locked
      - name: Install pinned native WebDriver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Exercise the real Linux client and persisted profile
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" python scripts/native_smoke.py --application target/release/liberte-client
      - name: Build the real server for native integration
        if: runner.os == 'Linux'
        run: cargo build --release --locked --bin liberte-server
      - name: Exercise two native clients and the real server
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24" python scripts/native_integration.py --application target/release/liberte-client --server target/release/liberte-server
      - name: Preserve native client diagnostics
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: native-smoke-linux-${{ github.sha }}
          path: |
            .ci-output/native-smoke
            .ci-output/native-integration
          if-no-files-found: warn
          retention-days: 14
      - name: Record package checksum and source commit
        run: python scripts/ci.py package-desktop --label ${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}-${{ github.sha }}
          path: .ci-output/desktop
          if-no-files-found: error
          retention-days: 14

  media:
    name: Browser media integration
    needs: frontend
    if: always() && needs.frontend.outputs.build == 'success'
    runs-on: ubuntu-24.04
    env:
      LIBERTE_SFU_TEST_URL: ws://127.0.0.1:7880
      LIBERTE_SFU_API_KEY: liberte-ci
      LIBERTE_SFU_API_SECRET: liberte-ci-only-not-a-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-lock
          path: frontend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start a local LiveKit instance for browser integration
        run: |
          docker run --detach --name liberte-ci-livekit --network host \
            --env "LIVEKIT_KEYS=$LIBERTE_SFU_API_KEY: $LIBERTE_SFU_API_SECRET" \
            livekit/livekit-server:v1.13.10 \
            --dev --bind 127.0.0.1 --node-ip 127.0.0.1
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:7880/; then exit 0; fi
            sleep 1
          done
          docker logs liberte-ci-livekit
          exit 1
      - run: npm run test:media
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-media-failure
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: warn
      - name: Preserve LiveKit diagnostics and stop the test server
        if: always()
        run: |
          docker logs liberte-ci-livekit || true
          docker rm --force liberte-ci-livekit || true

  rust:
    name: Rust format, check, tests and Clippy
    needs: lockfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cargo-lock
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libgtk-3-dev libglib2.0-dev libasound2-dev patchelf libssl-dev pkg-config
      - name: Check formatting and preserve a correction patch
        id: format
        continue-on-error: true
        run: python3 scripts/ci.py format-patch
      - uses: actions/upload-artifact@v4
        if: steps.format.outcome == 'failure'
        with:
          name: rustfmt-patch
          path: .ci-output/rustfmt.patch
          if-no-files-found: warn
      - id: check
        continue-on-error: true
        run: cargo check --workspace --all-targets --locked
      - id: tests
        continue-on-error: true
        run: cargo test --workspace --locked
      - id: clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - id: build
        continue-on-error: true
        run: cargo build --bin liberte-server --locked
      - name: Exercise the running server API
        id: smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: python3 scripts/ci.py smoke --binary target/debug/liberte-server
      - name: Require every Rust and runtime check to pass
        if: always()
        env:
          FORMAT: ${{ steps.format.outcome }}
          CHECK: ${{ steps.check.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          for result in "$FORMAT" "$CHECK" "$TESTS" "$CLIPPY" "$BUILD" "$SMOKE"; do
            test "$result" = success || exit 1
          done

  docker:
    name: Docker build, export, load and API smoke
    needs: lockfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cargo-lock
      - uses: docker/setup-buildx-action@v3
      - name: Build a loadable image
        run: docker buildx build --platform linux/amd64 --load --tag liberte-ci:${{ github.sha }} --file docker/Dockerfile .
      - name: Export and reload the actual image
        shell: bash
        run: |
          set -euo pipefail
          docker save --output liberte-ci.tar liberte-ci:${{ github.sha }}
          test -s liberte-ci.tar
          docker image rm liberte-ci:${{ github.sha }}
          docker load --input liberte-ci.tar
          docker image inspect liberte-ci:${{ github.sha }} > /dev/null
      - name: Check health and authentication after reload
        run: python3 scripts/ci.py smoke --image liberte-ci:${{ github.sha }}


[package]
name = "liberte-client"
version.workspace = true
edition.workspace = true
authors = ["Kayfeer"]

[features]
# Synthetic native capture is for the isolated Linux QA binary only.
# Release builds reject this feature in media_permissions.rs.
qa-media-devices = []

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", features = [] }

[dependencies]
liberte-shared = { workspace = true }
liberte-net    = { workspace = true }
liberte-media  = { workspace = true }
liberte-store  = { workspace = true }
tauri = { version = "=3.0.0-alpha.5", features = ["tray-icon"] }
rusqlite = { version = "0.31" }
tauri-plugin-shell = "=3.0.0-alpha.3"
tauri-plugin-dialog = { version = "=3.0.0-alpha.4", default-features = false, features = ["xdg-portal"] }
tauri-plugin-fs = "=3.0.0-alpha.3"
tauri-plugin-notification = "=3.0.0-alpha.3"
# Official v3 updater with the upstream ZIP 9 security fix applied locally.
tauri-plugin-updater = { path = "../../vendor/tauri-plugin-updater" }
tauri-plugin-process = "=3.0.0-alpha.3"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hex = { workspace = true }
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
chrono = { workspace = true }
directories = "5"
tempfile = "3"
uuid = { workspace = true }
libp2p = { workspace = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[lib]
name = "liberte_client_lib"
path = "src/lib.rs"

[target.'cfg(target_os = "linux")'.dependencies]
tauri-runtime-cef = "=3.0.0-alpha.6"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-runtime-wry = "=3.0.0-alpha.5"

